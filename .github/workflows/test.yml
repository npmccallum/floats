name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.platform.os }}, ${{ matrix.platform.target }}, ${{ matrix.rust }}, "${{ matrix.features }}")
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.60", "stable", "nightly"]
        features: ["", "asm", "casting", "nightly", "asm,casting", "asm,nightly", "casting,nightly", "asm,casting,nightly"]
        platform:
          # `runnable` marks targets whose binaries the runner can execute, so
          # the test step knows where it can do more than cross-compile.
          # aarch64-unknown-linux-gnu is cross-built from an x86_64 runner: its
          # binaries cannot be executed, and its C dev-dependencies would need
          # an aarch64-linux-gnu toolchain to even link.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            runnable: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            runnable: false
          - os: macos-latest
            target: x86_64-apple-darwin
            runnable: true # via Rosetta
          - os: macos-latest
            target: aarch64-apple-darwin
            runnable: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            runnable: true
        exclude:
          - rust: "1.60"
            features: "nightly"
          - rust: "1.60"
            features: "asm,nightly"
          - rust: "1.60"
            features: "casting,nightly"
          - rust: "1.60"
            features: "asm,casting,nightly"
          - rust: "stable"
            features: "nightly"
          - rust: "stable"
            features: "asm,nightly"
          - rust: "stable"
            features: "casting,nightly"
          - rust: "stable"
            features: "asm,casting,nightly"
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.platform.target }}

      - name: Build
        # `aarch64-unknown-linux-gnu`'s default target-feature set is just
        # `neon`, not `fp16`, so without this the aarch64 hardware path
        # (`src/half/aarch64`) is never even *built* by this cross-compiled,
        # build-only cell -- a break there would reach users only through
        # their own codegen, never through CI.
        env:
          RUSTFLAGS: ${{ matrix.platform.target == 'aarch64-unknown-linux-gnu' && '-C target-feature=+fp16' || '' }}
        run: cargo build --target "${{ matrix.platform.target }}" --no-default-features --features "${{ matrix.features }}" --verbose

      - name: Run tests
        if: matrix.platform.runnable && matrix.rust == 'nightly' && contains(matrix.features, 'casting') && !contains(matrix.features, 'nightly')
        run: cargo test --target "${{ matrix.platform.target }}" --no-default-features --features "${{ matrix.features }}" --verbose

  # The main matrix above pins `rust: ["1.60", "stable", "nightly"]`. Because
  # "stable" always means whatever is current *when CI runs*, that matrix is
  # structurally blind to breakage in the interior version range: the aarch64
  # NEON f16 intrinsics (`src/half/aarch64/fl32.rs`) require rustc 1.94 and
  # silently no-op (cfg'd out) below it, so every version from 1.61 to 1.93
  # would build this crate "successfully" while producing an empty aarch64
  # hardware path -- and once "stable" itself passes 1.94, that whole broken
  # window becomes invisible to the existing matrix. Pinning the empirical
  # MSRV boundary here turns "we happened to test after the fact" into a
  # permanent regression guard.
  aarch64-msrv-boundary:
    name: aarch64 NEON f16 intrinsics (rust 1.94)
    runs-on: macos-latest # aarch64 by default on GitHub's macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - name: Build and test
        run: cargo test --no-default-features --features asm,casting --verbose

  # The x86_64 acceleration is gated on `target_feature`, which no target enables
  # by default: `x86_64-unknown-linux-gnu` baselines at sse2. Without an explicit
  # RUSTFLAGS the `src/half/x86_64` trees are never compiled, so a build break
  # there reaches users through their own codegen rather than through CI.
  #
  # F16C is available on every GitHub x86_64 runner (Ivy Bridge and later), so
  # those tests are executed. AVX-512 FP16 needs Sapphire Rapids, so it is only
  # built -- and built as a test binary, since the conversions are `#[inline]`
  # and are not codegen'd for an rlib alone.
  x86-target-features:
    name: x86_64 (${{ matrix.target_feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_feature: ["+f16c", "+avx512fp16"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build tests
        env:
          RUSTFLAGS: "-C target-feature=${{ matrix.target_feature }}"
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --features asm,casting --no-run --verbose

      - name: Run tests
        if: matrix.target_feature == '+f16c'
        env:
          RUSTFLAGS: "-C target-feature=${{ matrix.target_feature }}"
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --features asm,casting --verbose

      # AVX-512 FP16 needs Sapphire Rapids or later, which no GitHub-hosted
      # runner has -- previously this leg only ever reached `--no-run`, so
      # the hand-written asm blocks for AVX-512 FP16 (including their
      # NaN and infinity saturation fixups) were built but never executed
      # anywhere. Intel SDE emulates the instructions in software: it proves
      # correctness (the properties this test suite checks), not timing.
      - name: Install Intel SDE
        if: matrix.target_feature == '+avx512fp16'
        run: |
          curl -sL -o sde.tar.xz "https://downloadmirror.intel.com/915934/sde-external-10.8.0-2026-03-15-lin.tar.xz"
          mkdir -p "$HOME/sde"
          tar xf sde.tar.xz --strip-components=1 -C "$HOME/sde"
          echo "$HOME/sde" >> "$GITHUB_PATH"

      - name: Run tests under SDE (Sapphire Rapids emulation)
        if: matrix.target_feature == '+avx512fp16'
        env:
          RUSTFLAGS: "-C target-feature=${{ matrix.target_feature }}"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde64 -spr --"
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --features asm,casting --test compat --verbose
