name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install Conventional Commits linter
        run: go install github.com/coolapso/convcommitlint@v0.3.0

      - name: Fetch base branch
        run: git fetch origin main:main --depth 1

      - name: Check Conventional Commits
        run: convcommitlint --base-branch main

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu

      - name: Run Clippy (with asm and casting)
        run: cargo clippy --features casting -- -D warnings

      - name: Run Clippy (software casting)
        run: cargo clippy --no-default-features --features casting -- -D warnings

      # The three lints above never touch any hardware conversion tree: none
      # of the enabled `target_feature`s (sse2 baseline on x86_64-unknown-
      # linux-gnu) turn on `src/half/aarch64`, `src/half/x86_64/f16c`, or
      # `src/half/x86_64/avx`. `cargo clippy` only needs to typecheck (no
      # linker involved), so cross-target and cross-target-feature runs work
      # here without any C toolchain.
      - name: Run Clippy (x86_64 F16C)
        env:
          RUSTFLAGS: "-C target-feature=+f16c"
        run: cargo clippy --no-default-features --features asm,casting -- -D warnings

      - name: Run Clippy (x86_64 AVX-512 FP16)
        env:
          RUSTFLAGS: "-C target-feature=+avx512fp16"
        run: cargo clippy --no-default-features --features asm,casting -- -D warnings

      - name: Run Clippy (aarch64 NEON FP16)
        env:
          RUSTFLAGS: "-C target-feature=+fp16"
        run: cargo clippy --target aarch64-unknown-linux-gnu --no-default-features --features asm,casting -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: xd009642/tarpaulin:develop-nightly
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v6

      - name: Generate code coverage
        run: cargo tarpaulin --out xml --no-default-features --features casting

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
