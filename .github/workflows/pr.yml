name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# ci-workarounds: `compat.rs` includes cases nightly cannot yet perform, so a
# plain `cargo test` fails. The steps below apply the same narrow stand-ins the
# test workflow does; see the `ci-workarounds` banner in test.yml for what each
# one is and which upstream fix retires it.

env:
  CARGO_TERM_COLOR: always

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install Conventional Commits linter
        run: go install github.com/coolapso/convcommitlint@v0.3.0

      - name: Fetch base branch
        run: git fetch origin main:main --depth 1

      - name: Check Conventional Commits
        run: convcommitlint --base-branch main

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu

      - name: Run Clippy (with asm and casting)
        run: cargo clippy --features casting -- -D warnings

      - name: Run Clippy (software casting)
        run: cargo clippy --no-default-features --features casting -- -D warnings

      # The three lints above never touch any hardware conversion tree: none
      # of the enabled `target_feature`s (sse2 baseline on x86_64-unknown-
      # linux-gnu) turn on `src/half/aarch64`, `src/half/x86_64/f16c`, or
      # `src/half/x86_64/avx`. `cargo clippy` only needs to typecheck (no
      # linker involved), so cross-target and cross-target-feature runs work
      # here without any C toolchain.
      - name: Run Clippy (x86_64 F16C)
        env:
          RUSTFLAGS: "-C target-feature=+f16c"
        run: cargo clippy --no-default-features --features asm,casting -- -D warnings

      - name: Run Clippy (x86_64 AVX-512 FP16)
        env:
          RUSTFLAGS: "-C target-feature=+avx512fp16"
        run: cargo clippy --no-default-features --features asm,casting -- -D warnings

      - name: Run Clippy (aarch64 NEON FP16)
        env:
          RUSTFLAGS: "-C target-feature=+fp16"
        run: cargo clippy --target aarch64-unknown-linux-gnu --no-default-features --features asm,casting -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # docs.rs builds with `features = ["asm", "casting"]` (package.metadata.docs.rs
      # above), so that's the config that must stay warning-clean. The bare
      # `cargo doc --no-deps` this job ran previously only builds the default
      # feature set (`asm` alone) and so never compiles the `casting`-gated
      # re-export -- a broken intra-doc link there merged green.
      - name: Check documentation
        run: cargo doc --no-deps --features asm,casting
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

  bench-compiles:
    name: Bench (compile-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      # No CI job ever compiled the bench: `cargo test --no-run` doesn't
      # build `harness = false` benches, so it can bit-rot silently as a
      # nightly-only API surface. Compile-only: benches/cast.rs is not a
      # meaningful timing measurement inside a CI runner anyway.
      - name: Compile benches
        run: cargo bench --no-run --features casting

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: xd009642/tarpaulin:develop-nightly
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v6

      - name: Generate code coverage (software paths)
        env:
          RUSTFLAGS: "--cfg ci_builtin_shims" # ci-workarounds
          CARGO_PROFILE_TEST_OPT_LEVEL: 1 # ci-workarounds
        run: cargo tarpaulin --out xml --output-dir sw --no-default-features --features casting

      # x86_64-unknown-linux-gnu doesn't enable F16C by default, so the
      # software-path run above never exercises `src/half/x86_64/f16c`.
      # AVX-512 FP16 needs Sapphire Rapids and isn't coverable here at all
      # (see .github/workflows/test.yml's `x86-target-features` job) --
      # tarpaulin's ptrace-based instrumentation is also x86_64-only, so
      # `src/half/aarch64` has no coverage venue in CI either. Both are
      # residual risk, not silently-passing gaps: they simply do not appear
      # in the report rather than appearing as covered.
      - name: Generate code coverage (x86_64 F16C)
        env:
          RUSTFLAGS: "-C target-feature=+f16c --cfg ci_builtin_shims" # ci-workarounds
          CARGO_PROFILE_TEST_OPT_LEVEL: 1 # ci-workarounds
        run: cargo tarpaulin --out xml --output-dir f16c --no-default-features --features asm,casting

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./sw/cobertura.xml,./f16c/cobertura.xml
          fail_ci_if_error: false
