[package]
name = "floats"
version = "0.2.0"
edition = "2021"
authors = ["Nathaniel McCallum <nathaniel@mccallum.life>"]
description = "f16 and f128 floating point types for compatibility with future Rust versions"
license = "MIT"
repository = "https://github.com/npmccallum/floats"
homepage = "https://github.com/npmccallum/floats"
documentation = "https://docs.rs/floats"
readme = "README.md"
keywords = ["float", "f16", "f128", "no_std"]
categories = ["no-std", "rust-patterns", "mathematics"]
rust-version = "1.60"

[dependencies]
casting = { version = "0.1.1", optional = true }

[features]
default = ["asm"]
nightly = ["casting?/nightly"]
asm = []

[dev-dependencies]
casting = { version = "0.1.1", features = ["nightly"] }
criterion = "0.8"
rstest = "0.26"

[lints.rust]
# `ci_builtin_shims` gates test-only stand-ins for compiler builtins nightly
# does not provide. TODO: remove with rust-lang/compiler-builtins#1261.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ci_builtin_shims)'] }

[package.metadata.docs.rs]
features = ["asm", "casting"]
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "cast"
harness = false
required-features = ["casting"]

